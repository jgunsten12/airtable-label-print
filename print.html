<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Barcode Label</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      padding: 24px;
    }

    .toolbar {
      max-width: 560px;
      margin: 0 auto 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar label {
      font-size: 14px;
      font-weight: 600;
    }

    .toolbar select,
    .toolbar input[type="number"],
    .toolbar button {
      font: inherit;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .toolbar input[type="number"] {
      width: 72px;
    }

    .toolbar button {
      background: #2d7ff9;
      color: #fff;
      border-color: #2d7ff9;
      cursor: pointer;
      font-weight: 600;
    }

    .toolbar button:hover { background: #1868db; }

    .summary {
      max-width: 560px;
      margin: 0 auto 12px;
      font-size: 14px;
      color: #444;
      text-align: center;
    }

    .labels {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 8px 0 24px;
    }

    .label {
      background: #fff;
      border: 1px dashed #999;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      min-width: 0;
    }

    .label.size-225x125 {
      width: 2.25in;
      height: 1.25in;
      padding: 0.06in 0.08in;
    }

    .label.size-1x1 {
      width: 1in;
      height: 1in;
      padding: 0.04in;
    }

    .barcode-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 auto;
      min-height: 0;
    }

    .label.size-225x125 .barcode-wrap svg { max-height: 0.58in; width: 100%; }
    .label.size-1x1 .barcode-wrap svg { max-height: 0.36in; width: 100%; }

    .text-block {
      min-width: 0;
      width: 100%;
      flex: 0 0 auto;
    }

    .item-name {
      font-weight: 700;
      line-height: 1.08;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .label.size-225x125 .item-name {
      font-size: 8pt;
      max-height: 0.24in;
      margin-top: 1px;
    }

    .label.size-1x1 .item-name {
      font-size: 4.5pt;
      max-height: 0.17in;
      margin-top: 0;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      line-height: 1.05;
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }

    .label.size-225x125 .meta { font-size: 8pt; margin-top: 1px; }
    .label.size-1x1 .meta { font-size: 5pt; margin-top: 0; }

    .meta .variation {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1 1 auto;
      min-width: 0;
    }

    .meta .price {
      flex: 0 0 auto;
      font-weight: 700;
      white-space: nowrap;
    }

    .label.size-225x125 .meta .price { font-size: 10.5pt; }
    .label.size-1x1 .meta .price { font-size: 6.5pt; }

    .error {
      max-width: 560px;
      margin: 0 auto;
      color: #b42318;
      background: #fef3f2;
      border: 1px solid #fecdca;
      padding: 12px;
      border-radius: 8px;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .toolbar, .summary { display: none !important; }
      .labels { gap: 0; padding: 0; }
      .label {
        border: none;
        page-break-after: always;
        break-after: page;
      }
      .label:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      @page { margin: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="size">Label size</label>
    <select id="size">
      <option value="225x125">2.25" × 1.25"</option>
      <option value="1x1">1" × 1"</option>
    </select>

    <label for="qty">Qty</label>
    <input id="qty" type="number" min="1" max="100" value="1" />

    <button id="printBtn" type="button">Print</button>
  </div>

  <div id="summary" class="summary" hidden></div>
  <div id="error" class="error" hidden></div>
  <div id="labels" class="labels"></div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const sku = params.get("sku") || "";
    const name = params.get("name") || "";
    const variation = params.get("variation") || "";
    const price = params.get("price") || "";
    let size = params.get("size") || "225x125";
    const initialQty = params.get("qty") || params.get("quantity") || "1";

    const sizeSelect = document.getElementById("size");
    const qtyInput = document.getElementById("qty");
    const labelsEl = document.getElementById("labels");
    const summaryEl = document.getElementById("summary");
    const errorEl = document.getElementById("error");
    const printBtn = document.getElementById("printBtn");

    function parseQuantity(value) {
      const n = parseInt(String(value), 10);
      if (Number.isNaN(n) || n < 1) return 1;
      return Math.min(n, 100);
    }

    function formatPrice(value) {
      if (value === "" || value == null) return "";
      const num = Number(String(value).replace(/[^0-9.-]/g, ""));
      if (Number.isNaN(num)) return String(value);
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
      }).format(num);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function itemNameFontSize(itemName, labelSize) {
      const len = String(itemName).length;
      if (labelSize === "1x1") {
        if (len > 42) return "3.5pt";
        if (len > 30) return "4pt";
        if (len > 20) return "4.5pt";
        return "5pt";
      }
      if (len > 52) return "5.5pt";
      if (len > 36) return "6.5pt";
      if (len > 24) return "7.5pt";
      return "8pt";
    }

    function createLabelMarkup(index, labelSize, itemName, itemVariation, itemPrice) {
      const nameSize = itemNameFontSize(itemName, labelSize);
      return `
        <div class="label size-${labelSize}">
          <div class="barcode-wrap"><svg id="barcode-${index}"></svg></div>
          <div class="text-block">
            <div class="item-name" style="font-size:${nameSize}">${escapeHtml(itemName)}</div>
            <div class="meta">
              <span class="variation">${escapeHtml(itemVariation)}</span>
              <span class="price">${escapeHtml(formatPrice(itemPrice))}</span>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      errorEl.hidden = true;
      summaryEl.hidden = true;
      labelsEl.innerHTML = "";

      if (!sku) {
        errorEl.textContent = "Missing SKU. Add ?sku=12345&name=...&variation=...&price=...&qty=5 to the URL.";
        errorEl.hidden = false;
        return;
      }

      size = sizeSelect.value;
      const qty = parseQuantity(qtyInput.value);
      qtyInput.value = String(qty);

      const barcodeHeight = size === "1x1" ? 28 : 44;
      const barcodeWidth = size === "1x1" ? 1.1 : 1.4;

      let markup = "";
      for (let i = 0; i < qty; i += 1) {
        markup += createLabelMarkup(i, size, name, variation, price);
      }
      labelsEl.innerHTML = markup;

      for (let i = 0; i < qty; i += 1) {
        JsBarcode("#barcode-" + i, String(sku), {
          format: "CODE128",
          width: barcodeWidth,
          height: barcodeHeight,
          displayValue: false,
          margin: 0,
        });
      }

      summaryEl.textContent = qty === 1
        ? "1 label ready to print"
        : qty + " identical labels ready to print";
      summaryEl.hidden = false;
    }

    sizeSelect.value = size === "1x1" ? "1x1" : "225x125";
    qtyInput.value = String(parseQuantity(initialQty));

    sizeSelect.addEventListener("change", render);
    qtyInput.addEventListener("change", render);
    qtyInput.addEventListener("input", render);
    printBtn.addEventListener("click", () => window.print());

    render();

    if (params.get("autoprint") === "1") {
      window.addEventListener("load", () => {
        setTimeout(() => window.print(), 300);
      });
    }
  </script>
</body>
</html>
